campaigns_dir: ~/.pocket-gm/campaigns
lancedb_path: ~/.pocket-gm/lancedb
logs_path: ~/.pocket-gm/logs

embedding:
  model: all-MiniLM-L6-v2
  batch_size: 64

retrieval:
  top_k: 5
  relevance_threshold: 0.35
  reranker_enabled: false
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2

llm:
  provider: ollama
  base_url: http://localhost:11434
  model: phi3:mini
  temperature: 0.1
  max_tokens: 512

whisper:
  model_size: base
  language: en
  device: cpu

chunking:
  sourcebook:
    chunk_size: 512
    chunk_overlap: 64
  notes:
    chunk_size: 256
    chunk_overlap: 32
  sessions:
    chunk_size: 256
    chunk_overlap: 32
    time_window_seconds: 120
