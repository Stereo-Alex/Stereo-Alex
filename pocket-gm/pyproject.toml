[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pocket-gm"
version = "0.1.0"
description = "Grounded Q&A CLI for tabletop RPG Game Masters"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "sentence-transformers>=3",
    "sqlite-vec>=0.1",
    "pymupdf>=1.24",
    "faster-whisper>=1.0",
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.optional-dependencies]
gdrive = [
    "google-auth>=2",
    "google-auth-oauthlib>=1",
    "google-api-python-client>=2",
]
serve = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
web = [
    "streamlit>=1.35",
    "anthropic>=0.30",
    "pandas>=2",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
pocket-gm = "pocket_gm.cli.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
